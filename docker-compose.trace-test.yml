# TEMPORARY - not for commit. Points worker+gateway span export at the local
# jaeger so a JVM build can be compared against the native build in the cluster.
services:
  kelta-worker:
    environment:
      MANAGEMENT_OPENTELEMETRY_TRACING_EXPORT_OTLP_ENDPOINT: http://jaeger:4318/v1/traces
      KELTA_TELEHEALTH_VISIT_SECRET: local-trace-test-visit-secret
      CAMPAIGN_TRACKING_SECRET: local-trace-test-campaign-secret
  kelta-gateway:
    environment:
      MANAGEMENT_OPENTELEMETRY_TRACING_EXPORT_OTLP_ENDPOINT: http://jaeger:4318/v1/traces
