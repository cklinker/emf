server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    # binaries only — no directory listings, no SPA fallback
    autoindex off;

    # Health check endpoint (kelta-ui pattern)
    location /health {
        access_log off;
        return 200 '{"status":"UP"}';
        add_header Content-Type application/json;
    }

    # Release binaries are content-addressed by version directory: immutable
    location /cli/releases/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        # binaries are already high-entropy — gzip would burn CPU for nothing
        gzip off;
    }

    # The update pointers must stay fresh: clients poll these
    location ~ ^/cli/(manifest\.json|latest\.txt)$ {
        expires 60s;
        add_header Cache-Control "public, max-age=60";
        default_type application/json;
    }

    location ~ ^/cli/install\.(sh|ps1)$ {
        expires 5m;
        default_type text/plain;
    }

    # Security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
}
